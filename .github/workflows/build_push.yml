name: Build KuManga APK

on:
  push:
    branches:
      - main
    paths:
      - '**'
      - '!**.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build KuManga APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing key
        if: ${{ secrets.SIGNING_KEY != '' }}
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | base64 -d > signingkey.jks

      - name: Build KuManga Extension
        env:
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew :src:es:kumanga:assembleRelease

      - name: Upload KuManga APK
        uses: actions/upload-artifact@v4
        with:
          name: kumanga-apk
          path: |
            src/es/kumanga/build/outputs/apk/release/*.apk
            src/es/kumanga/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Clean up CI files
        if: always()
        run: |
          [ -f signingkey.jks ] && rm -f signingkey.jks || true
